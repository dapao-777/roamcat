name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Module graph + unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 阅读器单测要 import fflate，先装依赖；--ignore-scripts 跳过各包的安装脚本（不下载浏览器）。
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Module graph gate
        run: node tools/verify-module-graph.cjs
      - name: Unit tests
        run: npm test
