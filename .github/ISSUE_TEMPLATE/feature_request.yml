name: 功能建议
description: 新功能或现有行为的改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景或不便，而不只是想要的实现方式
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: privacy
    attributes:
      label: 自查
      options:
        - label: 该功能不会默认把页面内容发送给远程服务
          required: false
        - label: 如该功能需要新权限或新的数据流，我已阅读 PRIVACY.md 并认为需要同步更新
          required: false
